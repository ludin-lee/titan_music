# Render 무료 플랜: 요청 수 제한 없음. 15분 동안 요청이 없으면 잠들고 첫 요청에 1분쯤 걸려 깨어남
services:
  - type: web
    name: titan-music
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /player
    envVars:
      - key: NEXT_PUBLIC_FLOORS # 여는 층. 바꾸고 저장하면 다시 빌드되며 열림
        value: "3,4"
      - key: QUEUE_LIMIT # 층마다 보관할 신청곡 수
        value: "50"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: PLAYER_PASSWORD_3
        sync: false
      - key: PLAYER_PASSWORD_4
        sync: false
